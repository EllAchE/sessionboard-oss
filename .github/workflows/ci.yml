name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # The alternative-designs survey keeps its structured data in docs/alternatives/data/ and
      # generates the matrix, the comparative requirements doc, and the visual grid from it. This
      # fails if someone edits the data without regenerating, or hand-edits a generated file.
      - run: bun run alternatives:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run db:check

  # `bun run audit` gates on high and critical only. Moderate advisories still surface in the job
  # log and in Dependabot's weekly pull requests, but they do not block unrelated work on a
  # schedule nobody in this repo controls. One known moderate lives here: drizzle-kit pulls the
  # deprecated `@esbuild-kit/core-utils`, which pins esbuild 0.18 (GHSA-67mh-4wv8-2f99, esbuild's
  # dev server). Nothing in this repo runs `esbuild serve`, drizzle-kit 0.31.10 is the latest
  # release and still depends on it, and Bun does not support scoped overrides — so the only way to
  # silence it would be a tree-wide esbuild downgrade that also drags wrangler off its pinned 0.28.
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run audit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Generated artifacts and the Compose file are contracts, not build output: a drifted
  # `openapi.json` or an invalid `docker-compose.yml` should report as itself rather than as
  # "Build failed".
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run docs:openapi
      - run: bun run docs:mcp
      - run: bun run docs:submission
      - run: git diff --exit-code -- docs/openapi.json docs/mcp-tools.json docs/submission
      - run: test -z "$(git status --porcelain --untracked-files=all -- docs/submission)"
      - run: docker compose config --quiet

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test

  # Kept as its own job rather than folded into `test`: this one needs a database, and the fast
  # suite staying database-free is what lets it run anywhere. A failure here is a failure of a rule
  # the service enforces — authorization, anonymity, blind review — not of a route's plumbing.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine3.23
        env:
          POSTGRES_USER: cicero
          POSTGRES_PASSWORD: cicero
          POSTGRES_DB: cicero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cicero -d cicero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://cicero:cicero@localhost:5432/cicero_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run test:integration
