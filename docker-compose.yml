# Self-host target (T-3): `docker compose up` and nothing else.
#
# The app container migrates before it serves and the mc container creates the bucket, so a
# judge who clones the repo never runs a second command. Credentials are deliberately weak
# defaults — this file is a demo target, not a production deployment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cicero
      POSTGRES_PASSWORD: cicero
      POSTGRES_DB: cicero
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cicero -d cicero']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cicero
      MINIO_ROOT_PASSWORD: cicero-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot. Without it the first upload fails against a bucket that does not exist yet.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cicero cicero-secret &&
      mc mb --ignore-existing local/cicero-files &&
      mc anonymous set download local/cicero-files
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://cicero:cicero@postgres:5432/cicero
      # The same S3 API the Cloudflare target uses against R2, pointed at MinIO instead.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: cicero-files
      S3_ACCESS_KEY_ID: cicero
      S3_SECRET_ACCESS_KEY: cicero-secret
      S3_FORCE_PATH_STYLE: 'true'
      # No API key in a clone, so every send is recorded to email_log and read at /admin/mail.
      MAIL_TRANSPORT: log
      MAIL_FROM: cicero@localhost
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  minio-data:
